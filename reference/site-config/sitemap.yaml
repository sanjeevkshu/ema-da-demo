# Sitemap for sanjeevkshu/ema-da-demo (Config Service: content/sitemap.yaml).
# Built from the query index, so it lists published site pages only (no nav,
# footer, fragments or library docs) and skips pages with robots: noindex.
# Without cdn.prod.host (not set yet) the host must come from `origin`, or every
# URL reads https://undefined/. Switch origin to the production domain at go-live.
version: 1
sitemaps:
  site:
    origin: https://main--ema-da-demo--sanjeevkshu.aem.live
    source: /query-index.json
    destination: /sitemap.xml
    lastmod: YYYY-MM-DD
