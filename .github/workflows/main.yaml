name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - run: npm run lint
    # Functional test coverage gate: every block must stay at 80%+ line,
    # branch and function coverage or the build fails. See test/README.md.
    - name: Test + coverage gate (80%+)
      run: npm run test:coverage
