name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 20
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - run: npm run lint
    # Headless accessibility lint (no browser, ~4 s): axe-core on every block's
    # decorated example in jsdom, plus the design-token contrast matrix.
    - run: npm run lint:a11y
    # Design tokens: the committed CSS/JSON match tokens/*.json (Style Dictionary).
    - run: npm run tokens:check
    # Functional test coverage gate: every block must stay at 80%+ line,
    # branch and function coverage or the build fails. See test/README.md.
    - name: Test + coverage gate (80%+)
      run: npm run test:coverage
