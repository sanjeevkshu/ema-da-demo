name: Design drift

# On demand: has the Figma file changed since the last reviewed sync?
# Compares every mapped frame with reference/design/figma-fingerprints.json
# and can export the page frames as PNGs for baseline review.
# Dormant until a FIGMA_TOKEN secret exists (Settings → Secrets and
# variables → Actions; a Figma personal access token with file read access).
# The same check runs from the workspace without a token: ask the agent to
# "check Figma drift". See .claude/skills/design-compliance/SKILL.md.
on:
  workflow_dispatch:
    inputs:
      export_frames:
        description: Also export the page frames as PNGs (artifact) for baseline review
        type: boolean
        default: false

jobs:
  drift:
    name: Figma drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Compare with the last sync
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          if [ "${{ inputs.export_frames }}" = "true" ]; then
            node test/design/drift.mjs --export figma-frames
          else
            node test/design/drift.mjs
          fi

      - name: Keep the frames
        if: inputs.export_frames
        uses: actions/upload-artifact@v7
        with:
          name: figma-frames
          path: figma-frames/
          retention-days: 14
          if-no-files-found: ignore
