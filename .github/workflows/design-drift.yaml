name: Design drift

# On demand: has the Figma file changed since the last reviewed sync?
# Compares every mapped frame with reference/design/figma-fingerprints.json.
# Dormant until a FIGMA_TOKEN secret exists (Settings → Secrets and
# variables → Actions; a Figma personal access token with file read access).
# The same check runs from the workspace without a token: ask the agent to
# "check Figma drift". See .claude/skills/design-compliance/SKILL.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Figma drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Compare with the last sync
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node test/design/drift.mjs
