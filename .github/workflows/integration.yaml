name: Integration

# System-integration checks (test/integration) against the deployed branch
# preview: consent gate, Brand Concierge + Web SDK/AEP, query index + search,
# crawl rules on the production domain, header/footer fragments.
#
#   PR into main (the develop -> main promotion): the full suite, blocking.
#   PR into develop: only when an integration file changed, and without the
#     Brand Concierge spec (it starts real chats that land in analytics).
#   Nightly: the full suite on main, to catch drift in Adobe-side config.
# @golden (grounded Brand Concierge answers) is report-only until grounding
# is fixed: see .claude/skills/integration-coverage/SKILL.md.
on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scope
        id: scope
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" != "develop" ]; then echo "run=full" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(node -e "const c=require('./test/integration/coverage.json'); const s=new Set(['test/integration/helpers.js']); Object.values(c.integrations).forEach((i)=>{(i.code||[]).forEach((f)=>s.add(f)); if (i.spec) s.add('test/integration/'+i.spec);}); console.log([...s].join('\n'))")
          if git diff --name-only "origin/$BASE...HEAD" | grep -qxF -f <(echo "$files"; echo ".github/workflows/integration.yaml"); then
            echo "run=subset" >> "$GITHUB_OUTPUT"
          else
            echo "run=none" >> "$GITHUB_OUTPUT"; echo "no integration file changed: nothing to check"
          fi

      - if: steps.scope.outputs.run != 'none'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - if: steps.scope.outputs.run != 'none'
        id: host
        uses: ./.github/actions/aem-host
        with:
          branch: ${{ github.head_ref || github.ref_name }}
          diff: ${{ github.base_ref && format('origin/{0}...HEAD', github.base_ref) || '' }}

      - if: steps.scope.outputs.run != 'none'
        run: npm ci

      - if: steps.scope.outputs.run != 'none'
        run: npx playwright install --with-deps chromium

      - name: Integration checks (blocking)
        if: steps.scope.outputs.run == 'full'
        env:
          INTEGRATION_BASE_URL: ${{ steps.host.outputs.url }}
        run: npm run test:integration -- --grep-invert @golden

      - name: Integration checks, no chats (blocking)
        if: steps.scope.outputs.run == 'subset'
        env:
          INTEGRATION_BASE_URL: ${{ steps.host.outputs.url }}
        run: npm run test:integration -- consent.spec.js search.spec.js fragments.spec.js

      - name: Grounded Brand Concierge answers (report-only)
        if: always() && steps.scope.outputs.run == 'full'
        continue-on-error: true
        env:
          INTEGRATION_BASE_URL: ${{ steps.host.outputs.url }}
        run: |
          npm run test:integration -- --grep @golden --reporter=list,github \
            || echo "::warning title=Brand Concierge grounding::golden answers failed; see the step log"

      - name: Keep the report
        if: always() && steps.scope.outputs.run != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-report
          path: test/integration/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
