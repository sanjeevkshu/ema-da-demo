name: Design (nightly)

# The live site, as visitors see it: the design gate's nightly levels
# (reference/design/gate.config.json) on the real page-type pages, not the
# frozen fixtures. It never blocks anything; a blocking layer that fails
# turns the run red so GitHub notifies. PRs are checked by pr-quality.yaml.
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design:
    name: Design (nightly) ${{ matrix.width }}px
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        width: [390, 768, 1440]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - env:
          DESIGN_BASE_URL: https://main--${{ github.event.repository.name }}--${{ github.repository_owner }}.aem.live
          DESIGN_PAGES: live
        run: node test/design/run.mjs --destination nightly --width ${{ matrix.width }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-nightly-${{ matrix.width }}
          path: test/design/design-report/
          retention-days: 14
          if-no-files-found: ignore
